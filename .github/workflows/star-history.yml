name: Generate Star History Image

on:
  schedule:
    - cron: '0 0 * * *' # 每天自动更新一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Chart
        # 修复了上一版少写斜杠的致命 Bug，直接用本地 Python 脚本稳定下载
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://star-history.com{{ github.repository }}&type=Date', 'star-history.png')"

      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add star-history.png
          git commit -m "chore: update star history [skip ci]" || exit 0
          git push
