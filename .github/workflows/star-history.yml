name: Generate Star History Chart

on:
  schedule:
    # 每天 UTC 0:00 (北京时间早上 8:00) 自动运行一次
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install resvg-cli
        run: |
          cargo install resvg

      - name: Download SVG and Convert to PNG
        run: |
          # 1. 下载 Star History SVG
          curl -s "https://api.star-history.com/svg?repos=WinddyAkoky/OnionParsing&type=Date" -o star-history.svg
          
          # 2. 将 SVG 转换成高分辨率 PNG (宽度设置为 1200px 保证清晰度)
          resvg --width 1200 star-history.svg star-history.png

      - name: Commit and Push Star History Chart
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update star history chart [skip ci]"
          file_pattern: 'star-history.png'
