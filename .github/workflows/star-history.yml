name: Generate Star History Chart

on:
  schedule:
    # 每天 UTC 0:00 (北京时间早上 8:00) 自动运行一次
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Star History SVG
        uses: star-history/star-history-action@v1.0.1
        with:
          # 在仓库设置中可选用 Personal Access Token，但一般默认 GITHUB_TOKEN 就足够
          token: ${{ secrets.GITHUB_TOKEN }}
          # 你的仓库路径
          repositories: 'WinddyAkoky/OnionParsing'
          # 生成的图片保存路径
          output: 'star-history.svg'

      - name: Commit and Push Star History Chart
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update star history chart [skip ci]"
          file_pattern: 'star-history.svg'
